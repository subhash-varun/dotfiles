# -----------------------------
# Tmux Development Configuration
# -----------------------------

# Use Ctrl-a as prefix (Primeagen-style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Keep Ctrl-b as a secondary prefix fallback
set -g prefix2 C-b

# Fast key response
set -s escape-time 0
set -g repeat-time 500

# Start window/pane indexing at 1 (more natural)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Better terminal support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

# Keep scrollback large enough for logs
set -g history-limit 100000

# Mouse support (resize/select/scroll)
set -g mouse on

# Vi-style keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Clipboard integration for Linux (Wayland/X11)
if-shell "command -v wl-copy >/dev/null 2>&1" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'"
if-shell "command -v xclip >/dev/null 2>&1" \
  "bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# Split panes in current directory
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# New window in current directory
bind c new-window -c '#{pane_current_path}'

# Primeagen-style smart pane navigation with Ctrl+h/j/k/l.
# If the pane is Neovim, send Ctrl key to Neovim; otherwise move tmux pane.
bind -n C-h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?vim?x?|nvim?)(diff)?$'" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?vim?x?|nvim?)(diff)?$'" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?vim?x?|nvim?)(diff)?$'" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?vim?x?|nvim?)(diff)?$'" 'send-keys C-l' 'select-pane -R'
bind -n C-\\ if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?vim?x?|nvim?)(diff)?$'" 'send-keys C-\\' 'select-pane -l'

# Also keep prefix + h/j/k/l pane movement.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r n next-window
bind -r p previous-window
bind -r Tab last-window

# Project session picker (ThePrimeagen-style workflow)
bind-key -r f run-shell "tmux new-window ~/.local/bin/tmux-sessionizer"

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=green]#S #[default]"
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M #[default]"

# Sensible defaults for activity and bells
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# Easier command prompt access
bind : command-prompt
